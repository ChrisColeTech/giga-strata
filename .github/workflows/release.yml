name: Release

# Builds the Windows app with the repo's own scripts, runs the full test suite (unit + golden
# parity), bundles the pinned llama-server from the owner's fork (scripts/server-release.txt,
# published by scripts/publish-server.bat) and zips the result.
# - Pushing a tag vX.Y.Z publishes a GitHub release with the zip. The tag must match the
#   project version in CMakeLists.txt.
# - Running it by hand builds and tests, and uploads the zip as a workflow artifact; tick
#   "publish" to also create a release (it then needs the version tag to exist or be created).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a GitHub release for v<project version>"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      QT_VERSION: "6.8.3"
      GIGA_STRATA_JOBS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Read the project version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(giga-strata VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match the project version $version in CMakeLists.txt"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tool venv (cmake, ninja, aqtinstall)
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check -q cmake==4.4.4 ninja==1.13.2 aqtinstall==3.3.0

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: C:\Qt\${{ env.QT_VERSION }}
          key: qt-${{ env.QT_VERSION }}-msvc2022_64

      - name: Install Qt
        shell: cmd
        run: scripts\setup.bat

      - name: Build release and run every test
        shell: cmd
        run: scripts\run-tests.bat release

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

      - name: Bundle the fork's llama-server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content scripts\server-release.txt -Raw).Trim()
          gh release download $tag --pattern llama-server-win64-cuda13.zip --dir $env:RUNNER_TEMP
          $server = "build\release\bin\server"
          New-Item -ItemType Directory -Force $server | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\llama-server-win64-cuda13.zip" -DestinationPath $server -Force
          Get-Content "$server\BUILD_INFO.txt"
          if (-not (Test-Path "$server\llama-server.exe")) { throw "llama-server.exe missing from $tag" }

      - name: Assemble the app folder and zip it
        id: package
        shell: pwsh
        run: |
          $name = "Giga-Strata-${{ steps.version.outputs.version }}-win64"
          $dist = "dist\$name"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\release\bin\* $dist -Recurse
          # Test executables and debug files are not part of the app.
          Get-ChildItem $dist -File | Where-Object {
            $_.Name -like 'test_*.exe' -or $_.Extension -in '.pdb', '.ilk' -or
            $_.BaseName -in 'layout_dump', 'plan_cli', 'moe_cli', 'launch_cli', 'fake_server'
          } | Remove-Item
          Copy-Item README.md $dist
          & 7z a -tzip -mx=7 "dist\$name.zip" ".\$dist\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          "zip=dist\$name.zip" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          Get-Item "dist\$name.zip" | Select-Object Name, Length

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Publish the GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $server = (Get-Content scripts\server-release.txt -Raw).Trim()
          $notes = "Windows x64 build. Includes the bundled llama-server from $server (CUDA 13; needs an NVIDIA driver with CUDA 13 support). Unzip anywhere and run giga-strata.exe."
          gh release create $tag "${{ steps.package.outputs.zip }}" --title "Giga Strata $tag" --notes $notes --generate-notes --target ${{ github.sha }}
